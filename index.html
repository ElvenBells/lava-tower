<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>Lava Tower — Три Башни (Three.js + GLSL · Co-op)</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div id="vignette"></div>
  <div id="flash"></div>

  <div id="bossHp">
    <div class="boss-name" id="bossName"></div>
    <div class="boss-bar">
      <div class="boss-bar-fill" id="bossBarFill"></div>
      <div class="boss-hp-text" id="bossHpText"></div>
    </div>
  </div>

  <!-- Основной HUD игрока и компактные виджеты союзников (Блок 4) -->
  <div id="hud">
    <div class="bar"><i id="hb"></i></div>
    <div class="bar"><i id="xb"></i></div>
    <div id="st"></div>
    <div id="coopPartyHud" class="coop-party-hud"></div>
  </div>

  <!-- Экранные стрелки-указатели к союзникам за пределами камеры (Блок 4) -->
  <div id="offscreenIndicators" class="offscreen-indicators"></div>

  <!-- Экранные маркеры 3D-пингов (сундук, сундук гильдии, алтарь, босс, лестница) -->
  <div id="pingOverlayContainer" class="ping-overlay-container"></div>

  <!-- Панель быстрого голосования за Глобальный пакт (F1 — За / F2 — Против) без паузы -->
  <div id="pactVoteWidget" class="pact-vote-widget" style="display:none"></div>

  <!-- Безпаузный хотбар выбора наград из 3 карточек (клавиши 1, 2, 3 и R для переброса) -->
  <div id="upgradeHotbar" class="upgrade-hotbar" style="display:none"></div>

  <!-- Панель параметров шейдеров/VFX, фонового звука и управления Бурей -->
  <div id="topVfxBar">
    <div id="vfxBanner" class="vfx-banner"></div>
    <div class="vfx-actions">
      <button id="pingActionBtn" type="button" class="vfx-btn" onclick="triggerPlayer3DPing()">📍 Пинг: СКМ / V</button>
      <button id="audioToggleBtn" type="button" class="vfx-btn" onclick="toggleGameAudioMute()">🔊 Горн: Вкл</button>
      <button id="stormToggleBtn" type="button" class="vfx-btn" onclick="triggerOrToggleStorm()">🌪 Буря: Авто / B</button>
    </div>
  </div>

  <div id="pauseHint">ESC — пауза · 1/2/3/R — карточки · G — сбросить золото · СКМ/V — 3D-пинг · F1/F2 — пакт · B — буря</div>
  <div id="toast"></div>

  <div id="ov" class="ov">
    <div class="pn" id="pn"></div>
  </div>

  <!-- Библиотека 3D-рендеринга Three.js r128 -->
  <script src="vendor/three.min.js"></script>

  <!-- Базовые утилиты, звук и конфигурация -->
  <script src="src/utils/math-and-rng.js"></script>
  <script src="src/audio/sound-engine.js"></script>
  <script src="src/config/game-data.js"></script>

  <!-- Сцена, освещение, пост-обработка и генератор процедурных текстур/шейдеров -->
  <script src="src/graphics/scene-setup.js"></script>
  <script src="src/graphics/procedural-textures.js"></script>

  <!-- Утилиты геометрии, 3D-модели героя, врагов, боссов и объектный пул мешей -->
  <script src="src/models/geometry-utils.js"></script>
  <script src="src/models/player-model.js"></script>
  <script src="src/models/enemy-models.js"></script>
  <script src="src/models/boss-models.js"></script>
  <script src="src/models/mob-factory.js"></script>

  <!-- Пулы частиц, молний, снарядов и генератор уровней башни -->
  <script src="src/effects/particles-and-fx.js"></script>
  <script src="src/world/tower-generator.js"></script>

  <!-- Боевая система, ИИ боссов, физика, рендер кадра и UI -->
  <script src="src/game/combat-and-loot.js"></script>
  <script src="src/game/boss-ai.js"></script>
  <script src="src/game/physics-and-step.js"></script>
  <script src="src/game/renderer.js"></script>
  <script src="src/ui/menus-and-hud.js"></script>

  <!-- Точка входа и главный игровой цикл -->
  <script src="src/main.js"></script>
</body>
</html>
